<!doctype html>
<html lang="pt-BR" data-tema="claro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#efebe5">
<meta name="color-scheme" content="light">
<title>Comercial · Elora</title>
<link rel="preload" href="fontes/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<script>
  // Mesmo esquema do Aspekto Business: claro é o padrão, só quem salvou 'escuro' vê o escuro.
  try {
    if (localStorage.getItem('aspekto:tema') === 'escuro') {
      document.documentElement.removeAttribute('data-tema');
      document.querySelector('meta[name=theme-color]').content = '#050505';
      document.querySelector('meta[name=color-scheme]').content = 'dark';
    }
  } catch (e) {}
</script>
<style>
@font-face {
  font-family: 'Inter Variable'; font-style: normal; font-display: swap; font-weight: 100 900;
  src: url(fontes/inter-latin-wght-normal.woff2) format('woff2-variations');
}
/* Tokens do Aspekto Business (web/src/estilo.css e telas/dashboard.css), escuro primeiro e o claro por cima. */
:root {
  --fundo: #050505; --painel: rgba(255, 255, 255, 0.035); --sup: rgba(255, 255, 255, 0.045);
  --sup-hover: rgba(255, 255, 255, 0.075); --afundado: rgba(0, 0, 0, 0.25); --opaco: #0b0b0b;
  --borda: rgba(255, 255, 255, 0.1); --borda-fraca: rgba(255, 255, 255, 0.06); --borda-hover: rgba(255, 255, 255, 0.2);
  --texto: #ffffff; --texto-2: rgba(255, 255, 255, 0.65); --texto-3: rgba(255, 255, 255, 0.45); --texto-4: rgba(255, 255, 255, 0.3);
  --texto-forte: #ffffff; --marca: #6baed5; --marca-texto: #9ed0ed; --marca-suave: rgba(107, 174, 213, 0.14);
  --marca-anel: rgba(107, 174, 213, 0.18); --alerta: #e7b864;
  --serie-1: #3987e5; --serie-2: #d95926; --serie-3: #199e70; /* paleta categórica validada do CRM (dashboard.css) */
  /* onde o lead parou: rampa ordinal de um azul só (validada), o neutro é quem não agendou */
  --passo-aprovou: #9cc3f2; --passo-veio: #4d8fe0; --passo-agendou: #1f5ca8; --passo-nao: rgba(255, 255, 255, 0.16);
  --trilho: rgba(255, 255, 255, 0.035);
  --fonte: 'Inter Variable', Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
  --t: 200ms;
}
:root[data-tema='claro'] {
  --fundo: #efebe5; --painel: rgba(255, 255, 255, 0.62); --sup: rgba(42, 41, 42, 0.04);
  --sup-hover: rgba(42, 41, 42, 0.075); --afundado: rgba(255, 255, 255, 0.78); --opaco: #faf8f5;
  --borda: rgba(42, 41, 42, 0.12); --borda-fraca: rgba(42, 41, 42, 0.07); --borda-hover: rgba(42, 41, 42, 0.24);
  --texto: #2a292a; --texto-2: rgba(42, 41, 42, 0.82); --texto-3: rgba(42, 41, 42, 0.68); --texto-4: rgba(42, 41, 42, 0.55);
  --texto-forte: #151415; --marca: #22385d; --marca-texto: #22385d; --marca-suave: rgba(107, 174, 213, 0.2);
  --marca-anel: rgba(107, 174, 213, 0.38); --alerta: #9a6710;
  --serie-1: #2a78d6; --serie-2: #eb6834; --serie-3: #1baf7a;
  --passo-aprovou: #1d5199; --passo-veio: #3f7fd4; --passo-agendou: #7eaeea; --passo-nao: rgba(42, 41, 42, 0.13);
  --trilho: rgba(42, 41, 42, 0.04);
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--fundo); color: var(--texto); font-family: var(--fonte); font-size: 14px; line-height: 1.45;
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3 { margin: 0; font-weight: 600; text-wrap: balance; }
button, a { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
/* quem pede menos movimento não vê barra crescer nem cor deslizar */
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; } }
.sutil { color: var(--texto-3); }

.tela { max-width: 1240px; margin: 0 auto; padding: 16px 24px 40px; display: flex; flex-direction: column; gap: 14px; }

/* ---------------------------------------------------------------- topo: duas faixas */
.dash-topo { display: flex; flex-direction: column; gap: 10px; }
.dash-nav { display: flex; align-items: center; gap: 14px; min-height: 48px; padding: 0 4px; border-bottom: 1px solid var(--borda); }
.dash-nav h1 { font-size: 20px; letter-spacing: -0.01em; }
.dash-cliente { font-size: 13px; color: var(--texto-3); }
.dash-nav .espaco { flex: 1; }
.dash-atualizado { font-size: 12px; color: var(--texto-4); font-variant-numeric: tabular-nums; white-space: nowrap; }
.btn-icone {
  display: inline-grid; place-items: center; width: 32px; height: 32px; border-radius: 9px; border: none; background: none;
  color: var(--texto-3); transition: background var(--t), color var(--t);
}
.btn-icone:hover { background: var(--sup-hover); color: var(--texto); }
.btn-icone:focus-visible { outline: none; box-shadow: 0 0 0 3px var(--marca-anel); }
.dash-barra { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 0 4px; }

.segmento { display: inline-flex; padding: 3px; gap: 2px; border-radius: 12px; background: var(--afundado); border: 1px solid var(--borda); max-width: 100%; overflow-x: auto; scrollbar-width: none; }
.segmento button {
  display: inline-flex; align-items: center; height: 26px; padding: 0 10px; border: none; border-radius: 9px; flex: none; white-space: nowrap;
  background: none; color: var(--texto-3); font-size: 12.5px; font-weight: 600; transition: background var(--t), color var(--t);
}
.segmento button:hover { color: var(--texto); }
.segmento button.on { background: rgba(255, 255, 255, 0.1); color: var(--texto); }
[data-tema='claro'] .segmento button.on { background: #fff; box-shadow: 0 1px 3px rgba(42, 41, 42, 0.1); }
.segmento button:focus-visible { outline: 2px solid var(--marca); outline-offset: -2px; }
.menu button:focus-visible { outline: 2px solid var(--marca); outline-offset: -2px; }

/* filtro quieto até ser usado: sem caixa; ligado ganha a cor da casa */
.seletor-rotulo {
  display: inline-flex; align-items: center; gap: 8px; height: 30px; padding: 0 8px; border-radius: 9px; max-width: 240px;
  border: 1px solid transparent; background: none; font-size: 12.5px; font-weight: 500; color: var(--texto-2);
}
.seletor-rotulo:hover { background: var(--sup-hover); color: var(--texto); }
.seletor-rotulo.on { border-color: var(--borda); background: var(--marca-suave); color: var(--marca-texto); }
.seletor-rotulo.aberto { border-color: var(--marca); box-shadow: 0 0 0 4px var(--marca-anel); background: none; }
.seletor-rotulo:focus-visible { outline: none; border-color: var(--marca); box-shadow: 0 0 0 4px var(--marca-anel); }
.seletor-rotulo svg { color: var(--texto-4); transition: transform var(--t); flex: none; }
.seletor-rotulo.aberto svg { transform: rotate(180deg); }
.seletor-rotulo[hidden] { display: none; }
.seletor-rotulo span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.menu {
  position: fixed; z-index: 80; min-width: 220px; padding: 6px; border-radius: 12px;
  background: var(--opaco); border: 1px solid var(--borda); box-shadow: 0 16px 40px rgba(0, 0, 0, 0.45);
}
[data-tema='claro'] .menu { background: #fff; box-shadow: 0 16px 40px rgba(34, 56, 93, 0.14); }
.menu button {
  display: grid; grid-template-columns: 1fr auto 16px; align-items: center; gap: 10px; width: 100%;
  padding: 7px 10px; border: none; border-radius: 8px; background: none; text-align: left; font-size: 13px; color: var(--texto-2);
}
.menu button:hover, .menu button.foco { background: var(--sup-hover); color: var(--texto); }
.menu button .n { font-size: 12px; color: var(--texto-4); font-variant-numeric: tabular-nums; }
.menu button .ok { color: var(--marca-texto); }
.menu hr { border: none; border-top: 1px solid var(--borda-fraca); margin: 4px 2px; }

/* ---------------------------------------------------------------- indicadores: uma faixa, divisórias finas */
.dash-kpis {
  display: grid; grid-template-columns: repeat(5, minmax(0, 1fr));
  background: var(--painel); border: 1px solid var(--borda); border-radius: 14px;
}
.dash-kpi { display: flex; flex-direction: column; gap: 4px; padding: 16px 20px 18px; min-width: 0; }
.dash-kpi + .dash-kpi { border-left: 1px solid var(--borda-fraca); }
.dash-kpi-rotulo { font-size: 12.5px; font-weight: 500; color: var(--texto-3); }
.dash-kpi > b { font-size: 30px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.15; color: var(--texto-forte); }
.dash-kpi-sub { font-size: 12px; line-height: 1.4; color: var(--texto-3); }
.maturando { color: var(--alerta); }

/* ---------------------------------------------------------------- seções */
.dash-secao {
  display: flex; flex-direction: column; gap: 14px; min-width: 0; padding: 18px 20px 20px;
  background: var(--painel); border: 1px solid var(--borda); border-radius: 14px;
}
.dash-secao-topo { display: flex; align-items: center; gap: 8px 12px; flex-wrap: wrap; min-height: 30px; }
.dash-secao-topo h2 { flex: 1 1 auto; font-size: 15px; letter-spacing: -0.01em; }
.dash-duas { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 14px; }

.dash-mini { display: flex; flex-wrap: wrap; gap: 10px 36px; }
#valores { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px 24px; padding-top: 4px; border-top: 1px solid var(--borda-fraca); }
.dash-mini > div { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.dash-mini-rotulo { font-size: 12px; font-weight: 500; color: var(--texto-3); }
.dash-mini b { font-size: 20px; font-weight: 600; letter-spacing: -0.01em; color: var(--texto-forte); }
.dash-mini b small { font-size: 12.5px; font-weight: 500; color: var(--texto-3); letter-spacing: 0; }
.dash-mini-sub { font-size: 12px; color: var(--texto-3); }
.dash-tempos { flex-direction: column; gap: 16px; }

.dash-legenda { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12px; color: var(--texto-2); }
.dash-legenda span { display: inline-flex; align-items: center; gap: 6px; }
.dash-legenda i { width: 10px; height: 10px; border-radius: 2px; display: inline-block; flex: none; }

/* ---------------------------------------------------------------- funil: barras horizontais */
.dash-hbarras { display: flex; flex-direction: column; gap: 2px; }
.dash-hbarra {
  display: grid; grid-template-columns: minmax(110px, 160px) minmax(0, 1fr) 48px 132px; align-items: center; gap: 12px;
  padding: 5px 6px; margin: 0 -6px; border-radius: 8px;
}
.dash-hbarra:hover { background: var(--sup); }
.dash-hbarra-rotulo { font-size: 13px; color: var(--texto-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dash-hbarra-trilho { height: 14px; background: var(--trilho); border-radius: 0 4px 4px 0; }
.dash-hbarra-trilho i { display: block; height: 100%; min-width: 2px; border-radius: 0 4px 4px 0; background: var(--serie-1); }
.dash-num { font-variant-numeric: tabular-nums; font-size: 13px; font-weight: 600; text-align: right; color: var(--texto); }
.dash-hbarra-pct { font-size: 12px; color: var(--texto-3); text-align: left; font-variant-numeric: tabular-nums; white-space: nowrap; }
.dash-hbarra-pct b { font-weight: 600; color: var(--texto-2); margin-right: 4px; }

/* ---------------------------------------------------------------- semanas: colunas empilhadas */
.dash-colunas-caixa { display: flex; flex-direction: column; gap: 6px; position: relative; }
.dash-colunas { display: grid; grid-template-columns: repeat(var(--n), minmax(6px, 1fr)); gap: 2px; }
/* a escala fica numa calha à direita, fora das colunas */
.dash-colunas { padding-right: 32px; }
.dash-colunas.plot { height: 180px; align-items: end; border-bottom: 1px solid var(--borda-fraca); position: relative; }
.dash-grade { position: absolute; left: 0; right: 32px; border-top: 1px solid var(--borda-fraca); pointer-events: none; }
.dash-grade span { position: absolute; left: calc(100% + 6px); top: -6px; font-size: 10.5px; line-height: 1; color: var(--texto-4); font-variant-numeric: tabular-nums; }
.dash-coluna { height: 100%; display: flex; align-items: flex-end; justify-content: center; border-radius: 4px 4px 0 0; position: relative; }
.dash-coluna:hover { background: var(--sup); }
.dash-coluna-pilha { display: flex; flex-direction: column-reverse; gap: 2px; width: min(22px, 70%); min-height: 0; }
.dash-coluna-pilha i { display: block; min-height: 2px; }
.dash-coluna-pilha i:last-child { border-radius: 4px 4px 0 0; }
.dash-coluna.maturando-col .dash-coluna-pilha { opacity: 0.5; }
.dash-colunas.eixo span { font-size: 10.5px; color: var(--texto-4); text-align: center; white-space: nowrap; overflow: visible; font-variant-numeric: tabular-nums; }
.dash-marca-mat { position: absolute; top: 0; bottom: 0; border-left: 1px dashed var(--borda-hover); pointer-events: none; }
.dash-marca-mat span { position: absolute; top: 0; left: 6px; font-size: 11px; color: var(--texto-3); white-space: nowrap; }

/* ---------------------------------------------------------------- tabelas */
.tabela-rolagem { overflow-x: auto; margin: 0 -4px; }
.tabela { width: 100%; border-collapse: collapse; }
.tabela th, .tabela td { padding: 8px 10px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.tabela th { text-align: left; font-size: 12px; font-weight: 500; color: var(--texto-3); border-bottom: 1px solid var(--borda); white-space: normal; }
.tabela td { font-size: 13px; border-bottom: 1px solid var(--borda-fraca); }
.tabela th:not(:first-child), .tabela td:not(:first-child) { text-align: right; }
.tabela td:first-child { min-width: 130px; color: var(--texto); }
.tabela tbody tr { transition: background var(--t); }
.tabela tbody tr:hover { background: var(--sup); }
.tabela tbody tr.on td { background: var(--marca-suave); }
.tabela tbody tr.on td:first-child { font-weight: 600; }
.tabela tfoot td { font-weight: 600; border-top: 1px solid var(--borda); border-bottom: none; }
.tabela .pct-n { font-size: 11.5px; color: var(--texto-4); margin-left: 4px; }
.dash-tabela-ver summary { font-size: 12.5px; color: var(--texto-3); cursor: pointer; width: fit-content; }
.dash-tabela-ver summary:hover { color: var(--texto); }
.dash-tabela-ver[open] summary { margin-bottom: 8px; }

/* ---------------------------------------------------------------- dica dos gráficos e o "i" */
.dash-tip {
  position: fixed; z-index: 95; pointer-events: none; min-width: 170px; max-width: 280px; padding: 8px 10px;
  border-radius: 10px; background: var(--opaco); border: 1px solid var(--borda);
  box-shadow: 0 10px 28px rgba(0, 0, 0, 0.35); font-size: 12px; color: var(--texto-2); display: none;
}
[data-tema='claro'] .dash-tip { background: #fff; box-shadow: 0 10px 28px rgba(34, 56, 93, 0.14); }
.dash-tip-titulo { font-size: 11.5px; color: var(--texto-3); margin-bottom: 4px; }
.dash-tip-linha { display: grid; grid-template-columns: 10px auto 1fr; align-items: center; gap: 8px; line-height: 1.7; }
.dash-tip-linha i { width: 10px; height: 10px; border-radius: 2px; }
.dash-tip-linha b { color: var(--texto-forte); font-weight: 600; font-variant-numeric: tabular-nums; }
.dash-tip-linha span { color: var(--texto-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dash-tip-nota { margin-top: 4px; color: var(--texto-3); }

.com-dica { display: inline-flex; align-items: center; gap: 4px; }
.dica-botao {
  display: inline-grid; place-items: center; width: 18px; height: 18px; flex: none; padding: 0;
  border: none; border-radius: 50%; background: none; color: var(--texto-4); cursor: help; transition: color var(--t), background var(--t);
}
.dica-botao:hover, .dica-botao.on, .dica-botao:focus-visible { color: var(--marca-texto); background: var(--marca-suave); outline: none; }
.dica-balao {
  position: fixed; z-index: 90; max-width: 320px; padding: 10px 12px; border-radius: 12px; font-size: 12.5px; line-height: 1.5;
  color: var(--texto-2); background: rgba(16, 16, 16, 0.98); border: 1px solid var(--borda); box-shadow: 0 16px 40px rgba(0, 0, 0, 0.5);
}
[data-tema='claro'] .dica-balao { background: #fff; box-shadow: 0 16px 40px rgba(34, 56, 93, 0.14); }
.dica-balao p { margin: 0; }
.dica-balao p + p { margin-top: 6px; }

/* ---------------------------------------------------------------- celular */
@media (max-width: 960px) {
  .dash-duas { grid-template-columns: 1fr; }
}
@media (max-width: 900px) {
  .dash-kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  /* 5 indicadores: o primeiro na linha toda, os outros em 2 × 2 (a coluna da direita são os ímpares) */
  .dash-kpi:first-child { grid-column: 1 / -1; }
  .dash-kpi + .dash-kpi { border-left: none; border-top: 1px solid var(--borda-fraca); }
  .dash-kpi:nth-child(odd):not(:first-child) { border-left: 1px solid var(--borda-fraca); }
}
@media (max-width: 720px) {
  .tela { padding: 8px 16px 32px; }
  .dash-nav { flex-wrap: wrap; row-gap: 0; padding-top: 4px; }
  .dash-nav h1 { font-size: 18px; }
  .dash-atualizado { display: none; }
  .dash-secao { padding: 14px 14px 16px; }
  .dash-kpi { padding: 12px 14px 14px; }
  .dash-kpi > b { font-size: 24px; }
  .dash-hbarra { grid-template-columns: 96px minmax(0, 1fr) 36px 52px; gap: 8px; }
  #valores { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .dash-hbarra-pct span { display: none; } /* no celular fica só o número; a base está na dica */
  .dash-colunas.eixo span:nth-child(even) { visibility: hidden; }
}
/* ---------------------------------------------------------------- popup da lista de vendas */
.rastreio tbody tr.clicavel, .rastreio tbody tr.grupo-linha.clicavel { cursor: pointer; }
.rastreio tbody tr.clicavel:hover td { background: var(--sup); }
.modal-fundo { position: fixed; inset: 0; z-index: 100; background: rgba(0, 0, 0, 0.45); display: grid; place-items: center; padding: 16px; }
[data-tema='claro'] .modal-fundo { background: rgba(42, 41, 42, 0.28); }
.modal {
  width: min(980px, 100%); max-height: min(82vh, 820px); display: flex; flex-direction: column; border-radius: 14px;
  background: var(--opaco); border: 1px solid var(--borda); box-shadow: 0 30px 100px rgba(0, 0, 0, 0.5);
}
[data-tema='claro'] .modal { background: #fff; box-shadow: 0 30px 100px rgba(34, 56, 93, 0.18); }
.modal-topo { display: flex; align-items: center; gap: 10px; padding: 16px 18px 12px; border-bottom: 1px solid var(--borda-fraca); }
.modal-topo h3 { margin: 0; font-size: 15px; font-weight: 600; flex: 1; }
.modal-topo .sutil { font-size: 12.5px; }
.modal-corpo { overflow: auto; overscroll-behavior: contain; padding: 4px 18px 16px; }
.modal .tabela tbody tr { content-visibility: auto; contain-intrinsic-size: auto 38px; } /* lista longa sem custo */
.modal-pe button:focus-visible, .senha-form button:focus-visible { outline: 2px solid var(--marca); outline-offset: 2px; }
.modal-pe { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 18px; border-top: 1px solid var(--borda-fraca); font-size: 12.5px; color: var(--texto-3); }
.modal-pe button { border: none; background: none; color: var(--texto-3); font-size: 12.5px; padding: 0; }
.modal-pe button:hover { color: var(--texto); text-decoration: underline; }
.modal .tabela td:first-child { min-width: 0; }
.modal .tabela td { white-space: normal; }
.modal .tabela td.num { white-space: nowrap; }
.venda-ponto { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 8px; vertical-align: 1px; }
.venda-selo { display: inline-block; margin-left: 6px; font-size: 11px; color: var(--alerta); white-space: nowrap; }
.senha-form { display: flex; flex-direction: column; gap: 10px; padding: 18px 0 6px; max-width: 360px; }
.senha-form input {
  height: 34px; padding: 0 10px; border-radius: 9px; border: 1px solid var(--borda); background: var(--sup); color: var(--texto); font: inherit;
}
.senha-form input:focus-visible { outline: none; border-color: var(--marca); box-shadow: 0 0 0 4px var(--marca-anel); }
.senha-form button { align-self: flex-start; height: 32px; padding: 0 14px; border-radius: 9px; border: none; background: var(--marca); color: var(--sobre-marca, #fff); font-weight: 600; }
[data-tema='claro'] .senha-form button { color: #fff; }
.senha-erro { font-size: 12.5px; color: var(--alerta); min-height: 18px; }

/* ---------------------------------------------------------------- abas: onde estou (sublinhadas, como no Pipeline do CRM) */
.dash-abas { display: flex; align-items: stretch; gap: 4px; align-self: stretch; margin-left: 8px; }
.dash-aba {
  display: inline-flex; align-items: center; padding: 0 10px; border: none; background: none; font-size: 13.5px; font-weight: 500; text-decoration: none;
  color: var(--texto-3); border-bottom: 2px solid transparent; margin-bottom: -1px; transition: color var(--t), border-color var(--t);
}
.dash-aba:hover { color: var(--texto); }

/* ---------------------------------------------------------------- aba CRM */

.rastreio tr.grupo-linha td { padding-top: 16px; font-weight: 600; color: var(--texto); border-bottom: 1px solid var(--borda); }
.rastreio tr.grupo-linha td:first-child { font-size: 13px; }
.rastreio tr.grupo-linha .parte-barra span { visibility: hidden; } /* subtotal: só o percentual, sem barra */

.rastreio td.parte { width: 34%; min-width: 140px; }
.rastreio .parte-barra { display: grid; grid-template-columns: minmax(0, 1fr) 46px; align-items: center; gap: 10px; }
.rastreio .parte-barra span { height: 8px; background: var(--trilho); border-radius: 0 4px 4px 0; }
.rastreio .parte-barra i { display: block; height: 100%; min-width: 2px; border-radius: 0 4px 4px 0; background: var(--serie-1); }
.rastreio .parte-barra.fora i { background: var(--passo-nao); }
.rastreio .parte-barra b { font-weight: 500; font-size: 12px; color: var(--texto-3); text-align: right; }
.rastreio td:first-child { white-space: normal; }
.rastreio tbody tr:not(.clicavel) { cursor: default; }
.rastreio tbody tr.clicavel td:first-child { padding-left: 18px; }
.rastreio tbody tr.grupo-linha.clicavel td:first-child { padding-left: 10px; }
.rastreio tr.clicavel:focus-visible { outline: 2px solid var(--marca); outline-offset: -2px; }

/* ---------------------------------------------------------------- datas personalizadas e estado do dado */
.dash-datas { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--texto-3); }
.dash-datas[hidden] { display: none; }
.dash-datas input {
  height: 30px; padding: 0 8px; border-radius: 8px; border: 1px solid var(--borda);
  background: var(--sup); color: var(--texto); font: inherit; font-size: 12.5px; color-scheme: dark;
}
[data-tema='claro'] .dash-datas input { color-scheme: light; background: #fff; }
.dash-datas input:focus-visible { outline: none; border-color: var(--marca); box-shadow: 0 0 0 4px var(--marca-anel); }
.dash-atualizado.velho { color: var(--alerta); }
.dash-estado { font-size: 12px; font-weight: 500; color: var(--alerta); }

<script src="dados.js"></script>
<script>
(() => {
  let D = window.FUNIL;
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  // ------------------------------------------------------------ formato
  const nf = new Intl.NumberFormat('pt-BR');
  const n = (x) => nf.format(x);
  const pct = (a, b, casas = 1) => (b ? (100 * a / b).toLocaleString('pt-BR', { minimumFractionDigits: casas, maximumFractionDigits: casas }) + '%' : '—');
  const brl = new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL', maximumFractionDigits: 0 });
  const reais = (x) => brl.format(Math.round(x));
  const brlCurto = new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL', notation: 'compact', maximumFractionDigits: 1 });
  const reaisCurto = (x) => (x >= 1e4 ? brlCurto.format(x) : reais(x));
  const dias = (d) => d == null ? '—' : d < 1 ? Math.max(1, Math.round(d * 24)) + ' h'
    : d.toLocaleString('pt-BR', { maximumFractionDigits: d < 10 ? 1 : 0 }) + (d < 2 ? ' dia' : ' dias');
  const ddmm = (iso) => iso.slice(8, 10) + '/' + iso.slice(5, 7);
  const leadsN = (x) => n(x) + (x === 1 ? ' lead' : ' leads');

  // ------------------------------------------------------------ datas (sempre no horário de Brasília)
  const DIA = 864e5;
  const isoBRT = (ms) => new Date(ms - 3 * 3600e3).toISOString();
  const hoje = () => isoBRT(Date.now()).slice(0, 10);
  const somaDias = (iso, k) => new Date(Date.parse(iso + 'T12:00:00Z') + k * DIA).toISOString().slice(0, 10);
  const diasEntre = (a, b) => Math.round((Date.parse(b + 'T12:00:00Z') - Date.parse(a + 'T12:00:00Z')) / DIA);
  const PRESETS = [
    ['hoje', 'Hoje'], ['ontem', 'Ontem'], ['7d', '7 dias'], ['30d', '30 dias'], ['mes', 'Este mês'], ['tudo', 'Tudo'], ['custom', 'Personalizado'],
  ];

  // ------------------------------------------------------------ estado: abre sempre em Hoje e todas as origens
  // avals: tipos de avaliação marcados no filtro (índices de D.avaliacoes); começa com todos
  const estado = { preset: 'hoje', de: hoje(), ate: hoje(), origem: 'todas', avals: [0, 1, 2], funilCrm: 14600179 };
  const nomeOrigem = (id) => id === 'todas' ? 'Todas as origens' : D.origens.find((o) => o.id === id).nome;

  function intervalo() {
    const h = hoje();
    switch (estado.preset) {
      case 'hoje': return [h, h];
      case 'ontem': return [somaDias(h, -1), somaDias(h, -1)];
      case '7d': return [somaDias(h, -6), h];
      case '30d': return [somaDias(h, -29), h];
      case 'mes': return [h.slice(0, 8) + '01', h];
      case 'tudo': return [D.primeiroDia || h, h];
      default: return [estado.de, estado.ate];
    }
  }
  function nomeIntervalo([a, b]) {
    if (a === b) return a === hoje() ? 'hoje' : a === somaDias(hoje(), -1) ? 'ontem' : ddmm(a);
    return `${ddmm(a)} a ${ddmm(b)}`;
  }

  // ------------------------------------------------------------ soma das linhas do período
  // linha: [hora, origem, leads, agendou, veio, orcou, aprovou, faltou, orcado, aprovado, [t1], [t2], [t3]]
  const quantil = (v, q) => {
    if (!v.length) return null;
    v.sort((x, y) => x - y);
    const i = (v.length - 1) * q, b = Math.floor(i);
    return v[b] + (v[Math.min(b + 1, v.length - 1)] - v[b]) * (i - b);
  };
  function linhasDe([a, b], origem) {
    const oi = origem === 'todas' ? -1 : D.origens.findIndex((o) => o.id === origem);
    return D.linhas.filter((l) => { const d = l[0].slice(0, 10); return d >= a && d <= b && (oi < 0 || l[1] === oi); });
  }
  function resumo(ls) {
    const r = { leads: 0, agendou: 0, veio: 0, orcou: 0, aprovou: 0, faltou: 0, orcado: 0, aprovado: 0, aprovouFora: 0, aprovadoFora: 0 };
    const t1 = [], t2 = [], t3 = [];
    for (const l of ls) {
      r.leads += l[2]; r.agendou += l[3]; r.veio += l[4]; r.orcou += l[5]; r.aprovou += l[6]; r.faltou += l[7]; r.orcado += l[8]; r.aprovado += l[9];
      t1.push(...l[10]); t2.push(...l[11]); t3.push(...l[12]);
      r.aprovouFora += l[13] || 0; r.aprovadoFora += l[14] || 0;
    }
    r.tempos = { leadAgenda: quantil(t1, 0.5), agendaConsulta: quantil(t2, 0.5), leadAprovacao: quantil(t3, 0.5), leadAprovacaoP80: quantil(t3, 0.8) };
    return r;
  }
  const corteMaturacao = () => isoBRT(Date.parse(D.extraidoEm) - D.maturacaoDias * DIA).slice(0, 10);
  // Eventos pela data em que aconteceram (regra do Nathan, 10/10): cada etapa conta o que a clínica fez no período.
  // evento: [hora, origem (-1 = sem lead no Kommo), tipo, quantidade, valor]
  function eventosNo([a, b]) {
    const oi = estado.origem === 'todas' ? null : D.origens.findIndex((o) => o.id === estado.origem);
    const t = {};
    for (const [h, o, tipo, q, v, av] of D.eventos || []) {
      const d = h.slice(0, 10);
      if (d < a || d > b || (oi != null && o !== oi)) continue;
      if (tipo !== 'casa' && av != null && !estado.avals.includes(av)) continue; // filtro de avaliação
      const x = (t[tipo] ??= { q: 0, v: 0 }); x.q += q; x.v += v;
    }
    const z = (k) => t[k] || { q: 0, v: 0 };
    return { marcada: z('marcada'), prevista: z('prevista'), compareceu: z('compareceu'), faltou: z('faltou'),
      orcamento: z('orcamento'), aprovado: z('aprovado'), casa: z('casa') };
  }
  const aguardandoNo = ([a, b]) => (D.aguardandoAceite || []).filter((h) => h.slice(0, 10) >= a && h.slice(0, 10) <= b);

  // ------------------------------------------------------------ dicas ("i")
  const DICAS = {
    funil: ['Leads criados no Kommo no período (sem o funil Contatos). O que aconteceu depois vem do Clinicorp, casado pelo telefone.',
      'Cada etapa conta o que aconteceu no período, pela data do fato, mesmo que não sejam as mesmas pessoas: avaliações marcadas (dia em que a recepção marcou), comparecidas (dia da consulta), orçamentos emitidos e aprovados (dia de cada um).',
      'Avaliação = só as categorias de anúncio no Clinicorp: Avaliação Meta, Avaliação Google e Urgência Google; cancelada não conta. Orçamento e aprovação de quem fez uma dessas avaliações antes, em qualquer data. Orçamentos de R$ 0 e o lote de 27/07 ficam de fora.',
      'Percentual de cada linha: agendaram ÷ leads; compareceram ÷ avaliações previstas no período; orçamento e aprovação ÷ comparecidas.'],
    marcadas: ['Avaliações (Meta, Google e Urgência Google, ou as escolhidas no filtro Avaliação) marcadas no Clinicorp no período, pela data em que a recepção marcou. Conta todas, inclusive de quem chegou em dias anteriores ou não está no Kommo. Canceladas não contam.'],
    agendaram: ['Avaliações marcadas no período ÷ leads que chegaram no período, mesmo que não sejam as mesmas pessoas (a avaliação de hoje pode ser de um lead de ontem).'],
    comparecimento: ['Avaliações atendidas no período ÷ avaliações que estavam marcadas para o período e já passaram (atendidas, faltas e sem status). Canceladas não entram.'],
    aprovacao: ['Orçamentos aprovados no período ÷ avaliações atendidas no período, mesmo que não sejam as mesmas pessoas.'],
    casa: ['Vendas do período de quem nunca fez avaliação de anúncio: base de pacientes, avaliação de outra origem (Indicação, Outdoor…) ou paciente novo marcado como procedimento. O detalhe está no Rastreio das vendas.'],
    rastreio: ['Toda venda (orçamento aprovado) do período, classificada pelo histórico do paciente na agenda do Clinicorp. O total bate com o aprovado no Clinicorp.',
      'Clique numa linha para ver quem comprou. A lista é protegida por senha.',
      'Marketing: o paciente fez Avaliação Meta, Google ou Urgência Google antes de comprar, em qualquer tempo (é a base do CAC). Sem janela de tempo: a mesma conta do funil.',
      'Outras origens: paciente novo cuja 1ª consulta foi marcada como procedimento, base de pacientes (retorno), avaliação de outra origem, reavaliação ou sem histórico.',
      'Conta pacientes por dia. Este quadro não muda com o filtro de avaliação.'],
    passagem: ['Cards que entraram nesta etapa no período ÷ cards que entraram na etapa de onde ela vem, no mesmo período (pela data de cada mudança, mesmo que não sejam os mesmos cards).',
      'Caminho: Entrada → Abordagem → Conectado → Convertido e SQL → Avaliação agendada → Compareceu → Em negociação → Aguardando compra → Fechado ganho. Desvios: Esfriou sobre Abordagem, Desqualificado sobre Entrada, No Show sobre Avaliação agendada, Fechado perdido sobre SQL.',
      'Pula etapa conta na etapa de chegada: um card que vai direto de Entrada para Conectado entra em Conectado sem ter passado por Abordagem.'],
    crm: ['Cards em cada etapa dos funis Leads e Oportunidades do Kommo, no fim de cada dia. O histórico começa em 10/10, quando os funis foram criados.',
      'Agora = fim do período; início = fim do dia anterior ao período. Entraram = cards que chegaram na etapa no período (por mudança de etapa ou lead criado já nela). A linha mostra o estoque dia a dia.',
      'Convertido, Desqualificado, Fechado ganho e Fechado perdido são etapas fechadas e não entram no total de abertos.'],
    leadsTempo: ['Leads criados no Kommo, pela hora em que chegaram, separados pelo DDD do telefone. Florianópolis = DDD 48; interior de SC = 47 e 49; outros estados = qualquer outro DDD do Brasil.',
      'O DDD 48 também cobre o sul do estado (Criciúma, Tubarão, Laguna), que fica junto com Florianópolis.'],
    leadsMes: ['Todos os meses desde o início do Kommo, com o filtro de origem aplicado. Não muda com o período.'],
    leadsUF: ['Leads de outros estados no período, pelo estado do DDD.'],
    tempos: ['Medianas por lead (a única parte que segue cada pessoa), entre os leads do período que chegaram ao passo. Contam desde a criação do lead no Kommo.'],
    semanas: ['Cada coluna é o período em que o lead chegou; a cor diz até onde ele foi.',
      () => `Leads dos últimos ${D.maturacaoDias} dias ainda estão em maturação: parte deles ainda vai agendar ou aprovar.`],
    origem: ['Origem pela etiqueta do Kommo. Lead com mais de uma etiqueta conta numa só, na ordem da tabela.',
      'As etiquetas começaram em agosto: 96% dos leads de julho estão sem etiqueta. Para comparar origens, olhe de agosto em diante.',
      'Clique numa linha para filtrar a página por ela.'],
  };
  const ICONE_I = '<svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v5"/><path d="M12 7.5v.01"/></svg>';
  let balao = null;
  function fecharDica() { if (balao) { balao.remove(); balao = null; document.querySelectorAll('.dica-botao.on').forEach((b) => b.classList.remove('on')); } }
  function abrirDica(btn) {
    fecharDica();
    balao = document.createElement('div'); balao.className = 'dica-balao'; balao.setAttribute('role', 'tooltip');
    balao.innerHTML = DICAS[btn.dataset.chave].map((p) => `<p>${esc(typeof p === 'function' ? p() : p)}</p>`).join('');
    document.body.appendChild(balao); btn.classList.add('on');
    const r = btn.getBoundingClientRect(), w = balao.offsetWidth, h = balao.offsetHeight;
    balao.style.left = Math.max(8, Math.min(r.left - 12, innerWidth - w - 8)) + 'px';
    balao.style.top = (r.bottom + 8 + h > innerHeight ? r.top - h - 8 : r.bottom + 8) + 'px';
  }
  function ligarDicas(raiz, atributo = 'dicaLocal') {
    raiz.querySelectorAll(atributo === 'dica' ? '[data-dica]' : '[data-dica-local]').forEach((s) => {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'dica-botao'; b.dataset.chave = s.dataset[atributo]; b.setAttribute('aria-label', 'Sobre este número');
      b.innerHTML = ICONE_I;
      b.addEventListener('mouseenter', () => abrirDica(b));
      b.addEventListener('mouseleave', fecharDica);
      b.addEventListener('focus', () => abrirDica(b));
      b.addEventListener('blur', fecharDica);
      b.addEventListener('click', (e) => { e.stopPropagation(); b.classList.contains('on') ? fecharDica() : abrirDica(b); });
      s.replaceWith(b);
    });
  }
  ligarDicas(document, 'dica');
  addEventListener('scroll', fecharDica, { passive: true });

  // ------------------------------------------------------------ dica que segue o ponteiro
  const tip = $('tip');
  function mostrarTip(e, html) {
    tip.innerHTML = html; tip.style.display = 'block';
    const w = tip.offsetWidth, h = tip.offsetHeight;
    let x = e.clientX + 14, y = e.clientY + 14;
    if (x + w > innerWidth - 8) x = e.clientX - w - 14;
    if (y + h > innerHeight - 8) y = e.clientY - h - 14;
    tip.style.left = Math.max(8, x) + 'px'; tip.style.top = Math.max(8, y) + 'px';
  }
  const esconderTip = () => { tip.style.display = 'none'; };
  const linhaTip = (cor, valor, rotulo) => `<div class="dash-tip-linha"><i style="background:${cor}"></i><b>${valor}</b><span>${esc(rotulo)}</span></div>`;
  // Um ouvinte só para a página toda: cada alvo guarda o html da dica em data-tip.
  let tipPendente = null;
  document.addEventListener('pointermove', (e) => {
    const alvo = e.target.closest && e.target.closest('[data-tip]');
    if (!alvo || e.pointerType === 'touch') { tipPendente = null; return esconderTip(); }
    if (!tipPendente) requestAnimationFrame(() => { if (tipPendente) mostrarTip(tipPendente.e, tipPendente.html); tipPendente = null; });
    tipPendente = { e, html: alvo.dataset.tip };
  });
  document.addEventListener('pointerleave', esconderTip);

  // ------------------------------------------------------------ tema
  const SOL = '<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4L6 18M18 6l1.4-1.4"/></svg>';
  const LUA = '<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>';
  const claro = () => document.documentElement.getAttribute('data-tema') === 'claro';
  function pintarBotaoTema() { $('tema').innerHTML = claro() ? LUA : SOL; $('tema').title = claro() ? 'Tema escuro' : 'Tema claro'; }
  $('tema').addEventListener('click', () => {
    const vaiClaro = !claro();

  // ------------------------------------------------------------ filtros: origem
  const SETA = '<svg aria-hidden="true" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>';

  let menu = null;

  function desenharOrigem() {

  // ------------------------------------------------------------ indicadores

      kpi(comDica('Comparecimento', 'comparecimento'), pct(e.compareceu.q, e.prevista.q), `${n(e.compareceu.q)} de ${plural(e.prevista.q, 'avaliação prevista', 'avaliações previstas')}`) +

  // ------------------------------------------------------------ rastreio das vendas (ignora o filtro de avaliação)
  function desenharRastreio(iv) {
    const caixa = $('rastreio'); if (!caixa) return;
    const [a, b] = iv;
    const oi = estado.origem === 'todas' ? null : D.origens.findIndex((o) => o.id === estado.origem);
    const mk = nomesAval().map(() => ({ q: 0, v: 0, ql: 0, vl: 0 })), fora = (D.categoriasFora || []).map(() => ({ q: 0, v: 0 }));
    for (const [h, o, tipo, q, v, k] of D.eventos || []) {
      const d = h.slice(0, 10);
      if (d < a || d > b || (oi != null && o !== oi)) continue;
      if (tipo === 'aprovado' && mk[k]) { mk[k].q += q; mk[k].v += v; }
      else if (tipo === 'aprovado_longo' && mk[k]) { mk[k].q += q; mk[k].v += v; mk[k].ql += q; mk[k].vl += v; }
      else if (tipo === 'casa' && fora[k]) { fora[k].q += q; fora[k].v += v; }
    }
    const soma = (xs) => xs.reduce((t, x) => ({ q: t.q + x.q, v: t.v + x.v }), { q: 0, v: 0 });
    const tm = soma(mk), to = soma(fora), tot = { q: tm.q + to.q, v: tm.v + to.v };
    const longo = mk.reduce((t, x) => t + x.ql, 0);

      `<td class="parte"><div class="parte-barra ${classe}"><span><i style="width:${tot.v ? (100 * x.v / tot.v).toFixed(1) : 0}%"></i></span><b>${tot.v ? pct(x.v, tot.v, 0) : '—'}</b></div></td></tr>`;
    const grupo = (nome, x, g) => `<tr class="grupo-linha clicavel" data-g="${g}" data-nome="${esc(nome)}" tabindex="0" role="button" aria-label="Ver quem comprou: ${esc(nome)}"><td>${esc(nome)}</td><td>${n(x.q)}</td><td>${reais(x.v)}</td><td class="parte"><div class="parte-barra"><span></span><b>${tot.v ? pct(x.v, tot.v, 0) : '—'}</b></div></td></tr>`;

    caixa.innerHTML = `<table class="tabela rastreio"><thead><tr><th>Origem da venda</th><th>Vendas</th><th>Valor</th><th>Parte do valor</th></tr></thead><tbody>` +
      grupo('Marketing (avaliação de anúncio)', tm, 'mk') + nomesAval().map((nome, i) => linha(nome, mk[i], '', notaLonga(mk[i]), `mk:${i}`)).join('') +
      grupo('Outras origens', to, 'fora') + (D.categoriasFora || []).map((nome, i) => linha(nome, fora[i], 'fora', '', `fora:${i}`)).join('') +
      `</tbody><tfoot><tr class="clicavel" data-g="" data-nome="Todas as vendas" tabindex="0" role="button" aria-label="Ver quem comprou: todas as vendas"><td>Total vendido</td><td>${n(tot.q)}</td><td>${reais(tot.v)}</td><td></td></tr></tfoot></table>`;
    $('rastreio-total').textContent = '';
  }

  // ------------------------------------------------------------ popup: quem comprou (lista criptografada)
  // vendas.enc.json: AES-256-GCM, chave PBKDF2-SHA256 (200 mil voltas) da senha do dono. A senha fica só neste navegador.
  const CHAVE_SENHA = 'nossolarmed:senha-vendas';
  let vendas = null, vendasDe = null;
  const b64 = (x) => Uint8Array.from(atob(x), (c) => c.charCodeAt(0));
  async function abrirVendas(senha) {
    const r = await fetch('vendas.enc.json?t=' + Date.now(), { cache: 'no-store' });
    if (!r.ok) throw new Error('arquivo');
    const enc = await r.json();
    if (vendas && vendasDe === enc.dados.slice(0, 32)) return vendas;
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(senha), 'PBKDF2', false, ['deriveKey']);
    const chave = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(enc.sal), iterations: 200000, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    const claro = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(enc.iv) }, chave, b64(enc.dados)); // falha = senha errada
    vendas = JSON.parse(new TextDecoder().decode(claro)); vendasDe = enc.dados.slice(0, 32);
    return vendas;
  }
  let modal = null, origemFoco = null;
  function fecharModal() {
    if (!modal) return;
    modal.remove(); modal = null;
    if (origemFoco && document.contains(origemFoco)) origemFoco.focus(); // o foco volta para a linha clicada
  }
  addEventListener('keydown', (e) => { if (e.key === 'Escape') fecharModal(); });
  function montarModal(titulo, sub, corpo, pe = '') {
    fecharModal();
    modal = document.createElement('div'); modal.className = 'modal-fundo';
    modal.innerHTML = `<div class="modal" role="dialog" aria-modal="true" aria-label="${esc(titulo)}"><div class="modal-topo"><h3>${esc(titulo)}</h3><span class="sutil">${sub}</span>` +
      `<button class="btn-icone" type="button" data-fechar aria-label="Fechar"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>` +
      `<div class="modal-corpo">${corpo}</div>${pe ? `<div class="modal-pe">${pe}</div>` : ''}</div>`;
    modal.addEventListener('click', (e) => { if (e.target === modal || e.target.closest('[data-fechar]')) fecharModal(); });
    // Tab circula dentro do popup
    modal.addEventListener('keydown', (e) => {
      if (e.key !== 'Tab') return;
      const f = [...modal.querySelectorAll('button, input, [tabindex="0"]')].filter((x) => !x.disabled);
      if (!f.length) return;
      if (e.shiftKey && document.activeElement === f[0]) { e.preventDefault(); f.at(-1).focus(); }
      else if (!e.shiftKey && document.activeElement === f.at(-1)) { e.preventDefault(); f[0].focus(); }
    });
    document.body.appendChild(modal);
    (modal.querySelector('input') || modal.querySelector('[data-fechar]')).focus();
    return modal;
  }
  function corDoGrupo(g) {
    const css = getComputedStyle(document.documentElement);
    if (g.startsWith('mk:')) return css.getPropertyValue(['--serie-1', '--serie-2', '--serie-3'][+g.split(':')[1]] || '--serie-1').trim();
    return css.getPropertyValue('--passo-nao').trim();
  }
  function nomeDoGrupo(g) {
    if (g.startsWith('mk:')) return nomesAval()[+g.split(':')[1]] || 'Marketing';
    return (D.categoriasFora || [])[+g.split(':')[1]] || 'Outras origens';
  }
  async function mostrarQuemComprou(filtroG, nomeLinha, gatilho) {
    if (gatilho) origemFoco = gatilho;
    const iv = intervalo();
    const sub = `${nomeIntervalo(iv)}${estado.origem !== 'todas' ? ' · ' + esc(nomeOrigem(estado.origem)) : ''}`;
    let senha = null;
    try { senha = localStorage.getItem(CHAVE_SENHA); } catch (e) {}
    if (senha) {
      try { return desenharLista(await abrirVendas(senha), filtroG, nomeLinha, sub); }
      catch (e) { try { localStorage.removeItem(CHAVE_SENHA); } catch (e2) {} }
    }
    const m = montarModal(nomeLinha, sub, `<form class="senha-form"><label for="senha-vendas">Senha da lista de vendas</label><input id="senha-vendas" name="senha" type="password" autocomplete="current-password" spellcheck="false" required><span class="senha-erro" aria-live="polite"></span><button type="submit">Ver lista</button></form>`);
    const f = m.querySelector('form');
    f.addEventListener('submit', async (e) => {
      e.preventDefault();
      const v = f.querySelector('input').value, erro = f.querySelector('.senha-erro');
      erro.textContent = 'Abrindo…';
      try { const lista = await abrirVendas(v); try { localStorage.setItem(CHAVE_SENHA, v); } catch (e2) {} desenharLista(lista, filtroG, nomeLinha, sub); }
      catch (err) { erro.textContent = err.message === 'arquivo' ? 'A lista só abre no painel publicado. Abra pelo link do GitHub.' : 'Senha incorreta. Confira e digite de novo.'; f.querySelector('input').select(); }
    });
  }
  function desenharLista(lista, filtroG, nomeLinha, sub) {
    const [a, b] = intervalo();
    const oi = estado.origem === 'todas' ? null : D.origens.findIndex((o) => o.id === estado.origem);
    const casa = (g) => !filtroG || g === filtroG || g.startsWith(filtroG + ':');
    const itens = lista.filter((x) => { const d = x.h.slice(0, 10); return d >= a && d <= b && (oi == null || x.o === oi) && casa(x.g); })
      .sort((x, y) => (x.h < y.h ? 1 : -1));
    const total = itens.reduce((t, x) => t + x.valor, 0);
    const pacientes = new Set(itens.map((x) => x.paciente.toLowerCase())).size;
    const corpo = itens.length
      ? `<table class="tabela"><thead><tr><th>Aprovado em</th><th>Paciente</th><th>Valor</th><th>Procedimentos</th><th>Profissional</th><th>Etiqueta no Kommo</th></tr></thead><tbody>` +
        itens.map((x) => `<tr><td class="num">${ddmm(x.h)} ${x.h.slice(11, 16)}</td>` +

  // ------------------------------------------------------------ aba Leads: região pelo DDD
  const REGIOES = [

  const regiaoDe = (ddd) => ddd === '48' ? 0 : ddd === '47' || ddd === '49' ? 1 : /^\d\d$/.test(ddd) ? 2 : 3;
  const UF = {};
  for (const [uf, ds] of Object.entries({ SP: '11 12 13 14 15 16 17 18 19', RJ: '21 22 24', ES: '27 28', MG: '31 32 33 34 35 37 38', PR: '41 42 43 44 45 46',
    SC: '47 48 49', RS: '51 53 54 55', DF: '61', GO: '62 64', TO: '63', MT: '65 66', MS: '67', AC: '68', RO: '69', BA: '71 73 74 75 77', SE: '79',
    PE: '81 87', AL: '82', PB: '83', RN: '84', CE: '85 88', PI: '86 89', PA: '91 93 94', AM: '92 97', RR: '95', AP: '96', MA: '98 99' })) for (const d of ds.split(' ')) UF[d] = uf;
  function linhasLeads([a, b]) {
    const oi = estado.origem === 'todas' ? null : D.origens.findIndex((o) => o.id === estado.origem);
    return (D.leadsDDD || []).filter(([h, o]) => { const d = h.slice(0, 10); return d >= a && d <= b && (oi == null || o === oi); });

  function desenharLeads(iv) {

  // ------------------------------------------------------------ aba CRM: evolução das etapas do Kommo

  // SQL → Agendada → Compareceu → Em negociação → Aguardando compra → Fechado ganho. Desvios medem sobre a etapa de onde saem.
  const BASE_ETAPA = {
    '14600179:112805211': '14600179:112805207', '14600179:112805215': '14600179:112805211', '14600179:142': '14600179:112805215',
    '14600179:112805219': '14600179:112805211', '14600179:143': '14600179:112805207',

  function desenharCrm(iv) {
    const C = D.crm; const caixa = $('crm-tabela');

  // Filtros na URL (?p=7d&o=google&av=0,1 ou ?de=…&ate=…): um link copiado abre igual. Sem parâmetro, abre em Hoje.

  // ------------------------------------------------------------ no tempo: por hora (1 dia), por dia (até 45) ou por semana
  const PASSOS = [['aprovou', 'Aprovou', '--passo-aprovou'], ['veio', 'Compareceu, sem aprovar', '--passo-veio'],
    ['agendou', 'Agendou, sem comparecer', '--passo-agendou'], ['nao', 'Não agendou', '--passo-nao']];
  function baldes([a, b]) {
    const nDias = diasEntre(a, b) + 1;
    if (nDias === 1) {
      const ate = a === hoje() ? +isoBRT(Date.now()).slice(11, 13) : 23;
      return { tipo: 'hora', lista: Array.from({ length: ate + 1 }, (_, h) => {
        const hh = String(h).padStart(2, '0'), chave = `${a}T${hh}`;
        return { rotulo: `${hh}h`, titulo: `${ddmm(a)}, das ${hh}h às ${hh}h59`, fim: a, casa: (l) => l[0] === chave };
      }) };
    }
    if (nDias <= 45) return { tipo: 'dia', lista: Array.from({ length: nDias }, (_, k) => {
      const d = somaDias(a, k);
      return { rotulo: ddmm(d), titulo: `Dia ${ddmm(d)}`, fim: d, casa: (l) => l[0].startsWith(d) };
    }) };

      const ini = s < a ? a : s, fim = somaDias(s, 6) > b ? b : somaDias(s, 6);
      lista.push({ rotulo: ddmm(s), titulo: `Semana de ${ddmm(ini)} a ${ddmm(fim)}`, fim, casa: (l) => { const d = l[0].slice(0, 10); return d >= ini && d <= fim; } });
    }

  function desenharTempo(iv) {

    });

    const bruto = Math.max(max / 4, 1), ordem = 10 ** Math.floor(Math.log10(bruto)), f = bruto / ordem;
    const passo = (f > 5 ? 10 : f > 2 ? 5 : f > 1 ? 2 : 1) * ordem;

      const t = `<div class="dash-tip-titulo">${s.titulo}</div>` +
        PASSOS.map(([k, rot]) => linhaTip(cores[k], `${n(s[k])} <span class="sutil">${pct(s[k], s.leads, 0)}</span>`, rot)).join('') +
        `<div class="dash-tip-nota">${leadsN(s.leads)}${s.maturando && !todosMat ? ' · em maturação' : ''}</div>`;
      // cada parte cresce na proporção da contagem; o vão de 2px entre elas sai do espaço, não soma altura
      const partes = PASSOS.map(([k]) => s[k] ? `<i style="flex:${s[k]} 1 0;background:${cores[k]}"></i>` : '').join('');
      return `<div class="dash-coluna${s.maturando && !todosMat ? ' maturando-col' : ''}" data-tip="${esc(t)}"><div class="dash-coluna-pilha" style="height:${(100 * s.leads / max).toFixed(2)}%">${partes}</div></div>`;
    }).join('');
    const iMat = ss.findIndex((s) => s.maturando);
    const marca = iMat > 0 ? `<div class="dash-marca-mat" style="left:calc((100% - 32px) * ${(iMat / ss.length).toFixed(4)} - 1px)"><span>em maturação</span></div>` : '';
    // rótulos do eixo: no máximo ~14, para não encavalar
    const cada = Math.ceil(ss.length / 14);
    $('semanas').innerHTML =
      `<div class="dash-colunas plot" style="--n:${ss.length}">${grades.map((v) => `<div class="dash-grade" style="bottom:${(100 * v / max).toFixed(2)}%"><span>${v}</span></div>`).join('')}${colunas}${marca}</div>` +
      `<div class="dash-colunas eixo" style="--n:${ss.length}">${ss.map((s, i) => `<span>${i % cada === 0 ? s.rotulo : ''}</span>`).join('')}</div>`;
    const cab = tipo === 'hora' ? 'Hora' : tipo === 'dia' ? 'Dia' : 'Semana';
    $('semanas-tabela').innerHTML = `<table class="tabela"><thead><tr><th>${cab}</th><th>Leads</th>${PASSOS.map(([, rot]) => `<th>${rot}</th>`).join('')}</tr></thead><tbody>` +
      ss.map((s) => `<tr><td>${s.rotulo}</td><td>${n(s.leads)}</td>${PASSOS.map(([k]) => `<td>${n(s[k])}<span class="pct-n">${pct(s[k], s.leads, 0)}</span></td>`).join('')}</tr>`).join('') +
      '</tbody></table>';
  }

  // ------------------------------------------------------------ por origem
  function desenharOrigens(iv) {
    const tot = resumo(linhasDe(iv, 'todas'));
    const celula = (a, b) => `${pct(a, b)}<span class="pct-n">${n(a)}</span>`;
    const tr = (r, nome, cls, attr) => `<tr class="${cls}" ${attr}><td>${esc(nome)}</td><td>${n(r.leads)}</td><td>${celula(r.agendou, r.leads)}</td>` +
      `<td>${celula(r.veio, r.agendou)}</td><td>${celula(r.aprovou, r.leads)}</td><td>${reais(r.aprovado)}</td><td>${r.leads ? reais(r.aprovado / r.leads) : '—'}</td></tr>`;
    $('origens').innerHTML = `<table class="tabela"><thead><tr><th>Origem</th><th>Leads</th><th>Agendaram</th><th>Compareceram<br><span class="sutil">dos agendados</span></th><th>Aprovaram</th><th>Aprovado</th><th>Aprovado por lead</th></tr></thead><tbody>` +
      D.origens.map((o) => tr(resumo(linhasDe(iv, o.id)), o.nome, o.id === estado.origem ? 'on' : '', `data-o="${o.id}" tabindex="0"`)).join('') +
      `</tbody><tfoot>${tr(tot, 'Total', '', '')}</tfoot></table>`;
  }
  if ($('origens')) $('origens').addEventListener('click', (e) => {
    const r = e.target.closest('tbody tr'); if (!r) return;
    escolherOrigem(r.dataset.o === estado.origem ? 'todas' : r.dataset.o);
  });
  if ($('origens')) $('origens').addEventListener('keydown', (e) => {
    const r = e.target.closest('tbody tr'); if (!r || (e.key !== 'Enter' && e.key !== ' ')) return;
    e.preventDefault(); escolherOrigem(r.dataset.o === estado.origem ? 'todas' : r.dataset.o);
  });

  // ------------------------------------------------------------ quando os dados foram puxados
  function desenharAtualizado() {
    const g = Date.parse(D.extraidoEm), min = (Date.now() - g) / 6e4;
    const quando = isoBRT(g);
    const el = $('atualizado');
    el.textContent = (quando.slice(0, 10) === hoje() ? 'Atualizado às ' : `Dados de ${ddmm(quando)} às `) + quando.slice(11, 16);
    // o PC que atualiza pode estar desligado: depois de 20 min parado, o horário fica em alerta
    el.classList.toggle('velho', min > 20);
    el.title = min > 20 ? 'Sem atualização há ' + (min < 120 ? Math.round(min) + ' min' : Math.round(min / 60) + ' h') : '';
  }

  // ------------------------------------------------------------ tudo
  function desenhar() {
    const iv = intervalo(), aba = abaAtual();
    document.querySelectorAll('.dash-aba').forEach((b) => { if (b.dataset.aba === aba) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current'); });
    gravarUrl();
    $('aba-funil').hidden = aba !== 'funil'; $('aba-leads').hidden = aba !== 'leads'; $('aba-crm').hidden = aba !== 'crm';
    $('avaliacao').hidden = aba !== 'funil'; // o tipo de avaliação só vale no Funil
    $('origem').hidden = aba === 'crm'; // a evolução do Kommo não é separada por etiqueta
    desenharPeriodo(); desenharOrigem(); desenharAvaliacao(); desenharAtualizado();
    if (aba === 'leads') desenharLeads(iv);
    else if (aba === 'crm') desenharCrm(iv);
    else { const r = resumo(linhasDe(iv, estado.origem)); desenharKpis(r, iv); desenharFunil(r); desenharTempos(r); desenharRastreio(iv); }
    document.title = `${{ leads: 'Leads', crm: 'CRM', funil: 'Funil' }[aba]} · ${nomeIntervalo(iv)} · Elora`;
  }
  if (!D || !D.linhas) D = { linhas: [], origens: D?.origens || [], aguardandoAceite: [], maturacaoDias: 21, extraidoEm: new Date(0).toISOString(), primeiroDia: null };
  lerUrl();
  desenhar();
  // as cores das barras vêm dos tokens: trocar o tema redesenha
  new MutationObserver(desenhar).observe(document.documentElement, { attributes: true, attributeFilter: ['data-tema'] });

  // ------------------------------------------------------------ ao vivo: busca o dados.json a cada minuto
  // (no GitHub Pages; aberto direto do disco o fetch falha em silêncio e fica o dados.js da carga)
  // Também logo ao abrir: o Pages guarda o dados.js em cache por até 10 min.
  let diaVisto = hoje();
  async function buscar() {
    try {
      const r = await fetch('dados.json?t=' + Date.now(), { cache: 'no-store' });
      if (r.ok) { const novo = await r.json(); if (novo.linhas && novo.geradoEm !== D.geradoEm) { D = novo; diaVisto = hoje(); return desenhar(); } }
    } catch (e) {}
    if (hoje() !== diaVisto) { diaVisto = hoje(); return desenhar(); } // virou o dia: "Hoje" anda junto
    desenharAtualizado();
  }
  buscar();
  setInterval(buscar, 60e3);
})();
</script>
</body>
</html>
